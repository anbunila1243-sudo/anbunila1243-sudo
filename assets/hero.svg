:1.05s"/><circle class="tw" cx="1047" cy="326" r="2" fill="#A9C7FF" style="animation-delay:0.21s"/><circle class="tw" cx="221" cy="513" r="2" fill="#A9C7FF" style="animation-delay:1.42s"/><circle class="tw" cx="163" cy="61" r="2.5" fill="#A9C7FF" style="animation-delay:2.1s"/><circle class="tw" cx="942" cy="175" r="2.5" fill="#A9C7FF" style="animation-delay:1.16s"/><text x="60" y="95" font-family="'SF Mono',Consolas,'Courier New',monospace" font-size="15" font-weight="bold" fill="#5B9BFF" text-anchor="start" letter-spacing="3">FULL STACK DEVELOPER ASPIRANT</text><text x="60" y="190" font-family="Georgia,'Times New Roman',serif" font-size="96" font-weight="bold" fill="#EAF2FF" text-anchor="start" filter="url(#glow)">D. Anbu</text><g clip-path="url(#tc)"><text x="60" y="255" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="normal" fill="#A9C7FF" text-anchor="start" font-style="italic">Responsive interfaces,</text><text x="60" y="290" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="normal" fill="#A9C7FF" text-anchor="start" font-style="italic">backed by solid databases.</text></g><rect class="blink" x="474" y="268" width="3" height="28" fill="#5B9BFF" filter="url(#glow)"/><rect x="60" y="330" width="87" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="103.5" y="350" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >React.js</text><rect x="157" y="330" width="102" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="208.0" y="350" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >JavaScript</text><rect x="269" y="330" width="72" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="305.0" y="350" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >Python</t