<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
<defs><style>.fade{animation:fade 1.1s ease-out backwards}@keyframes fade{from{opacity:0}to{opacity:1}}
.card{animation:glowb 5s ease-in-out infinite}@keyframes glowb{0%,100%{stroke:#1E3A7A;stroke-opacity:.85}50%{stroke:#5B9BFF;stroke-opacity:1}}
.pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.float{animation:float 4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.spin{animation:spin 28s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.08}50%{opacity:.95}}
.shine{transform:translateX(-400px);animation:shine 8s ease-in-out infinite}@keyframes shine{0%{transform:translateX(-300px)}55%,100%{transform:translateX(1500px)}}
.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.line{animation:lineIn .6s ease-out backwards}@keyframes lineIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
.ecg{stroke-dasharray:90 260;animation:ecg 2.6s linear infinite}@keyframes ecg{from{stroke-dashoffset:350}to{stroke-dashoffset:0}}</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060B18"/><stop offset="1" stop-color="#0B1530"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1E3A7A" fill-opacity=".55"/></pattern>
<linearGradient id="sg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A9C7FF" stop-opacity="0"/><stop offset=".5" stop-color="#A9C7FF" stop-opacity=".13"/><stop offset="1" stop-color="#A9C7FF" stop-opacity="0"/></linearGradient>
<clipPath id="rc"><rect width="1200" height="470" rx="22"/></clipPath>
<filter id="glow" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="4" result="b"><animate attributeName="stdDeviation" values="2;6;2" dur="3.5s" repeatCount="indefinite"/></feGaussianBlur><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="470" rx="22" fill="url(#bg)"/>
<rect width="1200" height="470" rx="22" fill="url(#dots)"/>
<rect x=".5" y=".5" width="1199" height="469" rx="22" fill="none" stroke="#1E3A7A"/>
<rect x="2" y="2" width="1196" height="466" rx="21" fill="none" stroke="#5B9BFF" stroke-width="1.5" class="pulse"/>
<g clip-path="url(#rc)"><polygon class="shine" points="0,470 70,0 170,0 100,470" fill="url(#sg)"/></g>
<g class="fade"><rect class="card" x="50" y="30" width="350" height="190" rx="16" fill="#0F1D3F" stroke="#1E3A7A" style="animation-delay:0.0s"/><text x="70" y="68" font-family="'SF Mono',Consolas,'Courier New',monospace" font-size="13" font-weight="bold" fill="#5B9BFF" text-anchor="start" letter-spacing="2">LANGUAGES</text><rect x="70" y="92" width="102" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="121.0" y="112" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >JavaScript</text><rect x="180" y="92" width="64" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="212.0" y="112" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >HTML5</text><rect x="252" y="92" width="56" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="280.0" y="112" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >CSS3</text><rect x="70" y="132" width="72" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="106.0" y="152" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >Python</text><rect class="card" x="425" y="30" width="350" height="190" rx="16" fill="#0F1D3F" stroke="#1E3A7A" style="animation-delay:0.5s"/><text x="445" y="68" font-family="'SF Mono',Consolas,'Courier New',monospace" font-size="13" font-weight="bold" fill="#5B9BFF" text-anchor="start" letter-spacing="2">FRONTEND</text><rect x="445" y="92" width="87" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="488.5" y="112" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >React.js</text><rect x="540" y="92" width="94" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="587.0" y="112" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >Bootstrap</text><rect x="445" y="132" width="155" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="522.5" y="152" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >Responsive Design</text><rect class="card" x="800" y="30" width="350" height="190" rx="16" fill="#0F1D3F" stroke="#1E3A7A" style="animation-delay:1.0s"/><text x="820" y="68" font-family="'SF Mono',Consolas,'Courier New',monospace" font-size="13" font-weight="bold" fill="#5B9BFF" text-anchor="start" letter-spacing="2">TOOLS &amp; PLATFORMS</text><rect x="820" y="92" width="49" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="844.5" y="112" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >Git</text><rect x="877" y="92" width="72" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="913.0" y="112" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >GitHub</text><rect x="957" y="92" width="79" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="996.5" y="112" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >VS Code</text><rect class="card" x="50" y="250" width="540" height="190" rx="16" fill="#0F1D3F" stroke="#1E3A7A" style="animation-delay:1.5s"/><text x="70" y="288" font-family="'SF Mono',Consolas,'Courier New',monospace" font-size="13" font-weight="bold" fill="#5B9BFF" text-anchor="start" letter-spacing="2">BACKEND &amp; DATABASE</text><rect x="70" y="312" width="49" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="94.5" y="332" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >PHP</text><rect x="127" y="312" width="64" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="159.0" y="332" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >MySQL</text><rect x="199" y="312" width="140" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="269.0" y="332" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >CRUD Operations</text><rect class="card" x="610" y="250" width="540" height="190" rx="16" fill="#0F1D3F" stroke="#1E3A7A" style="animation-delay:2.0s"/><text x="630" y="288" font-family="'SF Mono',Consolas,'Courier New',monospace" font-size="13" font-weight="bold" fill="#5B9BFF" text-anchor="start" letter-spacing="2">CORE COMPETENCIES</text><rect x="630" y="312" width="140" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="700.0" y="332" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >Problem Solving</text><rect x="778" y="312" width="94" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="825.0" y="332" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >Debugging</text><rect x="880" y="312" width="163" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="961.5" y="332" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >Team Collaboration</text><rect x="630" y="352" width="140" height="30" rx="15" fill="#0F1D3F" stroke="#1E3A7A"/><text x="700.0" y="372" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" fill="#A9C7FF" text-anchor="middle" >Time Management</text></g>
</svg>