<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
<defs><style>.fade{animation:fade 1.1s ease-out backwards}@keyframes fade{from{opacity:0}to{opacity:1}}
.card{animation:glowb 5s ease-in-out infinite}@keyframes glowb{0%,100%{stroke:#1E3A7A;stroke-opacity:.85}50%{stroke:#5B9BFF;stroke-opacity:1}}
.pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.float{animation:float 4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.spin{animation:spin 28s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.08}50%{opacity:.95}}
.shine{transform:translateX(-400px);animation:shine 8s ease-in-out infinite}@keyframes shine{0%{transform:translateX(-300px)}55%,100%{transform:translateX(1500px)}}
.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.line{animation:lineIn .6s ease-out backwards}@keyframes lineIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
.ecg{stroke-dasharray:90 260;animation:ecg 2.6s linear infinite}@keyframes ecg{from{stroke-dashoffset:350}to{stroke-dashoffset:0}}</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060B18"/><stop offset="1" stop-color="#0B1530"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1E3A7A" fill-opacity=".55"/></pattern>
<linearGradient id="sg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A9C7FF" stop-opacity="0"/><stop offset=".5" stop-color="#A9C7FF" stop-opacity=".13"/><stop offset="1" stop-color="#A9C7FF" stop-opacity="0"/></linearGradient>
<clipPath id="rc"><rect width="1200" height="330" rx="22"/></clipPath>
<filter id="glow" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="4" result="b"><animate attributeName="stdDeviation" values="2;6;2" dur="3.5s" repeatCount="indefinite"/></feGaussianBlur><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="330" rx="22" fill="url(#bg)"/>
<rect width="1200" height="330" rx="22" fill="url(#dots)"/>
<rect x=".5" y=".5" width="1199" height="329" rx="22" fill="none" stroke="#1E3A7A"/>
<rect x="2" y="2" width="1196" height="326" rx="21" fill="none" stroke="#5B9BFF" stroke-width="1.5" class="pulse"/>
<g clip-path="url(#rc)"><polygon class="shine" points="0,330 70,0 170,0 100,330" fill="url(#sg)"/></g>
<g class="fade"><rect class="card" x="50" y="40" width="540" height="250" rx="16" fill="#0F1D3F" stroke="#1E3A7A" style="animation-delay:0.0s"/><text x="80" y="130" font-family="Georgia,'Times New Roman',serif" font-size="54" font-weight="bold" fill="#5B9BFF" text-anchor="start" filter="url(#glow)">01</text><text x="170" y="110" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" fill="#EAF2FF" text-anchor="start" >Full Stack Development</text><text x="170" y="144" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" fill="#EAF2FF" text-anchor="start" >Internship</text><text x="170" y="200" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="normal" fill="#8DA2C8" text-anchor="start" >Issued by Novitech</text><line x1="170" y1="222" x2="550" y2="222" stroke="#5B9BFF" stroke-width="2" class="pulse"/><rect class="card" x="610" y="40" width="540" height="250" rx="16" fill="#0F1D3F" stroke="#1E3A7A" style="animation-delay:0.6s"/><text x="640" y="130" font-family="Georgia,'Times New Roman',serif" font-size="54" font-weight="bold" fill="#5B9BFF" text-anchor="start" filter="url(#glow)">02</text><text x="730" y="110" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" fill="#EAF2FF" text-anchor="start" >Mental Health</text><text x="730" y="144" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" fill="#EAF2FF" text-anchor="start" >First Aider</text><text x="730" y="200" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="normal" fill="#8DA2C8" text-anchor="start" >Issued by Mpower</text><line x1="730" y1="222" x2="1110" y2="222" stroke="#5B9BFF" stroke-width="2" class="pulse"/></g>
</svg>